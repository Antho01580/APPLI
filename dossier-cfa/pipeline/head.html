<title>Vérification analytique WE-FORM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --teal:#14807D; --teal-d:#0E605E; --teal-p:#E4F0EF;
  --ink:#14201F; --ink-2:#43524F; --ink-3:#7A8683;
  --paper:#FBFCFB; --paper-2:#F2F5F4; --paper-3:#E9EEEC;
  --rule:#DDE4E1; --rule-2:#C3CECA;
  --charge:#A8412C; --produit:#2A6B4F; --charge-p:#FAEEEB;
  --shadow:0 1px 2px rgba(20,32,31,.06), 0 8px 24px rgba(20,32,31,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --teal:#4FBFBB; --teal-d:#7FD6D3; --teal-p:#12302F;
    --ink:#E7EDEB; --ink-2:#A6B3B0; --ink-3:#78847F;
    --paper:#0E1413; --paper-2:#151D1C; --paper-3:#1D2726;
    --rule:#26312F; --rule-2:#38443F;
    --charge:#E4907A; --produit:#79C79E; --charge-p:#2A1712;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --teal:#4FBFBB; --teal-d:#7FD6D3; --teal-p:#12302F;
  --ink:#E7EDEB; --ink-2:#A6B3B0; --ink-3:#78847F;
  --paper:#0E1413; --paper-2:#151D1C; --paper-3:#1D2726;
  --rule:#26312F; --rule-2:#38443F;
  --charge:#E4907A; --produit:#79C79E; --charge-p:#2A1712;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font:400 14px/1.55 "Public Sans","Segoe UI",system-ui,sans-serif;
  margin:0; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Newsreader,Georgia,serif; font-weight:600; letter-spacing:-.01em; text-wrap:balance; margin:0}
.mono,td.n,th.n{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ---------- ossature ---------- */
.wrap{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh}
nav{
  border-right:1px solid var(--rule); background:var(--paper-2);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:20px 0 32px;
}
.brand{padding:0 18px 16px; border-bottom:1px solid var(--rule); margin-bottom:10px}
.brand h1{font-size:17px; line-height:1.2}
.brand p{margin:5px 0 0; font-size:11.5px; color:var(--ink-3); line-height:1.4}
.navlist{display:flex; flex-direction:column; gap:1px; padding:0 8px}
.navlist button{
  display:grid; grid-template-columns:20px 1fr; gap:9px; align-items:baseline;
  text-align:left; background:none; border:0; cursor:pointer; color:var(--ink-2);
  font:500 12.5px/1.35 inherit; padding:7px 10px; border-radius:5px; width:100%;
}
.navlist button .k{font:600 10.5px/1 "IBM Plex Mono",monospace; color:var(--ink-3)}
.navlist button:hover{background:var(--paper-3); color:var(--ink)}
.navlist button[aria-current="true"]{background:var(--teal); color:#fff}
.navlist button[aria-current="true"] .k{color:rgba(255,255,255,.72)}
.navlist button:focus-visible{outline:2px solid var(--teal); outline-offset:1px}

main{padding:30px 34px 90px; max-width:1500px}
.head{border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:22px}
.eyebrow{font:600 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); margin:0 0 8px}
.head h2{font-size:27px; line-height:1.15}
.head p{margin:9px 0 0; color:var(--ink-2); font-size:13.5px; max-width:78ch}

/* ---------- tables ---------- */
.tw{overflow-x:auto; border:1px solid var(--rule); border-radius:7px; background:var(--paper); margin:0 0 26px}
table{border-collapse:collapse; width:100%; font-size:12.5px}
thead th{
  background:var(--paper-2); color:var(--ink-2); text-align:left; font-weight:600;
  font-size:11px; letter-spacing:.03em; text-transform:uppercase;
  padding:9px 11px; border-bottom:1px solid var(--rule-2); position:sticky; top:0; z-index:2;
  white-space:nowrap;
}
thead th.n{text-align:right}
tbody td{padding:6px 11px; border-bottom:1px solid var(--rule); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--paper-2)}
td.n{text-align:right; white-space:nowrap}
td.c{text-align:center}
tr.sum td{background:var(--teal-p); font-weight:700; color:var(--teal-d); border-top:1px solid var(--teal); border-bottom:1px solid var(--teal)}
tr.sub td{background:var(--paper-3); font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2)}
tr.sum:hover td{background:var(--teal-p)}
.neg{color:var(--charge)} .pos{color:var(--produit)}
.z{color:var(--ink-3)}
.wide{max-width:none} td.lib{min-width:230px}
.small{font-size:11.5px; color:var(--ink-3)}

/* ---------- chiffres cliquables ---------- */
button.f{
  font:inherit; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  background:none; border:0; padding:0 1px; margin:0; cursor:pointer; color:inherit;
  border-bottom:1px dotted var(--rule-2); border-radius:2px;
}
button.f:hover{background:var(--teal-p); color:var(--teal-d); border-bottom-color:var(--teal)}
button.f:focus-visible{outline:2px solid var(--teal); outline-offset:1px}
button.f.calc{border-bottom-style:dashed; border-bottom-color:var(--ink-3)}
button.f[disabled]{cursor:default; border-bottom:0; opacity:.55}

/* ---------- tiroir ---------- */
.scrim{position:fixed; inset:0; background:rgba(20,32,31,.32); opacity:0; pointer-events:none;
  transition:opacity .16s ease; z-index:40}
.scrim.on{opacity:1; pointer-events:auto}
aside{
  position:fixed; top:0; right:0; height:100vh; width:min(1080px,96vw); z-index:50;
  background:var(--paper); border-left:1px solid var(--rule-2); box-shadow:var(--shadow);
  transform:translateX(101%); transition:transform .2s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
aside.on{transform:none}
.dhead{padding:18px 22px 14px; border-bottom:1px solid var(--rule); background:var(--paper-2)}
.dhead .row{display:flex; justify-content:space-between; align-items:flex-start; gap:16px}
.dhead h3{font-size:18px; line-height:1.2}
.dhead .why{margin:7px 0 0; font-size:12.5px; color:var(--ink-2); max-width:70ch}
.dclose{background:none; border:1px solid var(--rule-2); color:var(--ink-2); cursor:pointer;
  border-radius:5px; width:28px; height:28px; font-size:15px; line-height:1; flex:none}
.dclose:hover{background:var(--paper-3); color:var(--ink)}
.check{display:flex; gap:22px; flex-wrap:wrap; margin-top:13px; padding-top:12px; border-top:1px solid var(--rule)}
.check div{display:flex; flex-direction:column; gap:2px}
.check .lab{font:600 9.5px/1 "IBM Plex Mono",monospace; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.check .val{font:600 15px/1.2 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.ok{color:var(--produit)} .ko{color:var(--charge)}
.dbody{overflow:auto; flex:1; padding:0}
.dbody table{font-size:12px}
.dbody td.lib{min-width:0; max-width:290px}
.dbody td.small{max-width:170px}
.dbody thead th{white-space:nowrap}
.dbody thead th{background:var(--paper-2)}
.empty{padding:40px 22px; color:var(--ink-3); font-size:13px}

/* ---------- divers ---------- */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; margin-bottom:26px}
.note{background:var(--paper-2); border-left:3px solid var(--teal); padding:12px 15px; border-radius:0 6px 6px 0;
  font-size:12.5px; color:var(--ink-2); margin:0 0 24px; max-width:105ch}
.note.warn{border-left-color:var(--charge); background:var(--charge-p)}
.note strong{color:var(--ink)}
.kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--rule);
  border:1px solid var(--rule); border-radius:7px; overflow:hidden; margin-bottom:26px}
.kpi div{background:var(--paper); padding:13px 15px}
.kpi .lab{font:600 9.5px/1 "IBM Plex Mono",monospace; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px}
.kpi .val{font:600 19px/1.15 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.tools{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.tools input,.tools select{
  font:inherit; font-size:12.5px; padding:6px 10px; border:1px solid var(--rule-2);
  border-radius:5px; background:var(--paper); color:var(--ink); min-width:130px}
.tools input:focus,.tools select:focus{outline:2px solid var(--teal); outline-offset:-1px; border-color:var(--teal)}
.tools .cnt{font-size:12px; color:var(--ink-3); margin-left:auto}
h3.sec{font-size:16px; margin:30px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--rule)}
@media (prefers-reduced-motion:reduce){aside,.scrim{transition:none}}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav{position:static; height:auto; border-right:0; border-bottom:1px solid var(--rule)}
  .navlist{flex-direction:row; flex-wrap:wrap}
  main{padding:22px 16px 70px}
}
</style>
