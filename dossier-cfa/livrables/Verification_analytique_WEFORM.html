<title>Vérification analytique WE-FORM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --teal:#14807D; --teal-d:#0E605E; --teal-p:#E4F0EF;
  --ink:#14201F; --ink-2:#43524F; --ink-3:#7A8683;
  --paper:#FBFCFB; --paper-2:#F2F5F4; --paper-3:#E9EEEC;
  --rule:#DDE4E1; --rule-2:#C3CECA;
  --charge:#A8412C; --produit:#2A6B4F; --charge-p:#FAEEEB;
  --shadow:0 1px 2px rgba(20,32,31,.06), 0 8px 24px rgba(20,32,31,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --teal:#4FBFBB; --teal-d:#7FD6D3; --teal-p:#12302F;
    --ink:#E7EDEB; --ink-2:#A6B3B0; --ink-3:#78847F;
    --paper:#0E1413; --paper-2:#151D1C; --paper-3:#1D2726;
    --rule:#26312F; --rule-2:#38443F;
    --charge:#E4907A; --produit:#79C79E; --charge-p:#2A1712;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --teal:#4FBFBB; --teal-d:#7FD6D3; --teal-p:#12302F;
  --ink:#E7EDEB; --ink-2:#A6B3B0; --ink-3:#78847F;
  --paper:#0E1413; --paper-2:#151D1C; --paper-3:#1D2726;
  --rule:#26312F; --rule-2:#38443F;
  --charge:#E4907A; --produit:#79C79E; --charge-p:#2A1712;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font:400 14px/1.55 "Public Sans","Segoe UI",system-ui,sans-serif;
  margin:0; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Newsreader,Georgia,serif; font-weight:600; letter-spacing:-.01em; text-wrap:balance; margin:0}
.mono,td.n,th.n{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ---------- ossature ---------- */
.wrap{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh}
nav{
  border-right:1px solid var(--rule); background:var(--paper-2);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:20px 0 32px;
}
.brand{padding:0 18px 16px; border-bottom:1px solid var(--rule); margin-bottom:10px}
.brand h1{font-size:17px; line-height:1.2}
.brand p{margin:5px 0 0; font-size:11.5px; color:var(--ink-3); line-height:1.4}
.navlist{display:flex; flex-direction:column; gap:1px; padding:0 8px}
.navlist button{
  display:grid; grid-template-columns:20px 1fr; gap:9px; align-items:baseline;
  text-align:left; background:none; border:0; cursor:pointer; color:var(--ink-2);
  font:500 12.5px/1.35 inherit; padding:7px 10px; border-radius:5px; width:100%;
}
.navlist button .k{font:600 10.5px/1 "IBM Plex Mono",monospace; color:var(--ink-3)}
.navlist button:hover{background:var(--paper-3); color:var(--ink)}
.navlist button[aria-current="true"]{background:var(--teal); color:#fff}
.navlist button[aria-current="true"] .k{color:rgba(255,255,255,.72)}
.navlist button:focus-visible{outline:2px solid var(--teal); outline-offset:1px}

main{padding:30px 34px 90px; max-width:1500px}
.head{border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:22px}
.eyebrow{font:600 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); margin:0 0 8px}
.head h2{font-size:27px; line-height:1.15}
.head p{margin:9px 0 0; color:var(--ink-2); font-size:13.5px; max-width:78ch}

/* ---------- tables ---------- */
.tw{overflow-x:auto; border:1px solid var(--rule); border-radius:7px; background:var(--paper); margin:0 0 26px}
table{border-collapse:collapse; width:100%; font-size:12.5px}
thead th{
  background:var(--paper-2); color:var(--ink-2); text-align:left; font-weight:600;
  font-size:11px; letter-spacing:.03em; text-transform:uppercase;
  padding:9px 11px; border-bottom:1px solid var(--rule-2); position:sticky; top:0; z-index:2;
  white-space:nowrap;
}
thead th.n{text-align:right}
tbody td{padding:6px 11px; border-bottom:1px solid var(--rule); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--paper-2)}
td.n{text-align:right; white-space:nowrap}
td.c{text-align:center}
tr.sum td{background:var(--teal-p); font-weight:700; color:var(--teal-d); border-top:1px solid var(--teal); border-bottom:1px solid var(--teal)}
tr.sub td{background:var(--paper-3); font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2)}
tr.sum:hover td{background:var(--teal-p)}
.neg{color:var(--charge)} .pos{color:var(--produit)}
.z{color:var(--ink-3)}
.wide{max-width:none} td.lib{min-width:230px}
.small{font-size:11.5px; color:var(--ink-3)}

/* ---------- chiffres cliquables ---------- */
button.f{
  font:inherit; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  background:none; border:0; padding:0 1px; margin:0; cursor:pointer; color:inherit;
  border-bottom:1px dotted var(--rule-2); border-radius:2px;
}
button.f:hover{background:var(--teal-p); color:var(--teal-d); border-bottom-color:var(--teal)}
button.f:focus-visible{outline:2px solid var(--teal); outline-offset:1px}
button.f.calc{border-bottom-style:dashed; border-bottom-color:var(--ink-3)}
button.f[disabled]{cursor:default; border-bottom:0; opacity:.55}

/* ---------- tiroir ---------- */
.scrim{position:fixed; inset:0; background:rgba(20,32,31,.32); opacity:0; pointer-events:none;
  transition:opacity .16s ease; z-index:40}
.scrim.on{opacity:1; pointer-events:auto}
aside{
  position:fixed; top:0; right:0; height:100vh; width:min(1080px,96vw); z-index:50;
  background:var(--paper); border-left:1px solid var(--rule-2); box-shadow:var(--shadow);
  transform:translateX(101%); transition:transform .2s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
aside.on{transform:none}
.dhead{padding:18px 22px 14px; border-bottom:1px solid var(--rule); background:var(--paper-2)}
.dhead .row{display:flex; justify-content:space-between; align-items:flex-start; gap:16px}
.dhead h3{font-size:18px; line-height:1.2}
.dhead .why{margin:7px 0 0; font-size:12.5px; color:var(--ink-2); max-width:70ch}
.dclose{background:none; border:1px solid var(--rule-2); color:var(--ink-2); cursor:pointer;
  border-radius:5px; width:28px; height:28px; font-size:15px; line-height:1; flex:none}
.dclose:hover{background:var(--paper-3); color:var(--ink)}
.check{display:flex; gap:22px; flex-wrap:wrap; margin-top:13px; padding-top:12px; border-top:1px solid var(--rule)}
.check div{display:flex; flex-direction:column; gap:2px}
.check .lab{font:600 9.5px/1 "IBM Plex Mono",monospace; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.check .val{font:600 15px/1.2 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.ok{color:var(--produit)} .ko{color:var(--charge)}
.dbody{overflow:auto; flex:1; padding:0}
.dbody table{font-size:12px}
.dbody td.lib{min-width:0; max-width:290px}
.dbody td.small{max-width:170px}
.dbody thead th{white-space:nowrap}
.dbody thead th{background:var(--paper-2)}
.empty{padding:40px 22px; color:var(--ink-3); font-size:13px}

/* ---------- divers ---------- */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; margin-bottom:26px}
.note{background:var(--paper-2); border-left:3px solid var(--teal); padding:12px 15px; border-radius:0 6px 6px 0;
  font-size:12.5px; color:var(--ink-2); margin:0 0 24px; max-width:105ch}
.note.warn{border-left-color:var(--charge); background:var(--charge-p)}
.note strong{color:var(--ink)}
.kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--rule);
  border:1px solid var(--rule); border-radius:7px; overflow:hidden; margin-bottom:26px}
.kpi div{background:var(--paper); padding:13px 15px}
.kpi .lab{font:600 9.5px/1 "IBM Plex Mono",monospace; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px}
.kpi .val{font:600 19px/1.15 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.tools{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.tools input,.tools select{
  font:inherit; font-size:12.5px; padding:6px 10px; border:1px solid var(--rule-2);
  border-radius:5px; background:var(--paper); color:var(--ink); min-width:130px}
.tools input:focus,.tools select:focus{outline:2px solid var(--teal); outline-offset:-1px; border-color:var(--teal)}
.tools .cnt{font-size:12px; color:var(--ink-3); margin-left:auto}
h3.sec{font-size:16px; margin:30px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--rule)}
@media (prefers-reduced-motion:reduce){aside,.scrim{transition:none}}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav{position:static; height:auto; border-right:0; border-bottom:1px solid var(--rule)}
  .navlist{flex-direction:row; flex-wrap:wrap}
  main{padding:22px 16px 70px}
}

/* ---- cartes de repères ---- */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin:0 0 26px}
.card{background:var(--paper-2); border:1px solid var(--rule); border-radius:10px; padding:13px 15px 12px;
      display:flex; flex-direction:column; gap:5px}
.card .lab{font-size:12px; color:var(--ink-3); line-height:1.35; text-wrap:balance}
.card .big{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
           font-size:25px; font-weight:600; color:var(--teal-d); letter-spacing:-.02em}
/* ---- barres de proportion ---- */
.bar{position:relative; display:inline-block; padding:1px 5px; border-radius:3px; min-width:2.2em; text-align:right}
.bar::before{content:''; position:absolute; inset:0; width:var(--w); border-radius:3px;
             background:var(--teal); opacity:.16}
.bar>*{position:relative}
.bar.wide{display:block; width:100%; height:9px; min-width:0; padding:0; background:var(--paper-3)}
.bar.wide::before{opacity:.55}

.lead{color:var(--ink-2); max-width:62ch; margin:-6px 0 14px; font-size:13.5px}
td.q{color:var(--teal-d); font-weight:500}
</style>

<script>
const D = window.__DATA__;
const L = D.lignes;
const AXN = ['Apprentissage','Formation continue','Ligue AURA','Commun','Hors périmètre'];
const NB = ' ';                                   // espace fine insécable
const E = (s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmt(v,blank){
  if(v==null||(blank&&Math.abs(v)<0.005)) return '·';
  const s = Math.abs(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,NB);
  return (v<0?'-':'')+s;
}
const R2b = v => Math.round(v*100)/100;
const cls = v => v==null||Math.abs(v)<0.005 ? 'z' : (v<0?'neg':'pos');

/* ---------- sélection des lignes composant un chiffre ---------- */
function select(f){
  if(!f) return [];
  let ix;
  if(f.idx) ix = f.idx.slice();
  else ix = L.map((_,i)=>i);
  return ix.filter(i=>{
    const l = L[i];
    if(f.cfa && l[5]!==f.cfa) return false;
    if(f.cls && l[5][0]!==f.cls) return false;
    if(f.src && l[4]!==f.src) return false;
    if(f.piece && l[1]!==f.piece) return false;
    if(f.cle && l[12]!==f.cle) return false;
    if(f.name && !norm(l[3]).includes(f.name)) return false;
    if(f.ax!=null && Math.abs(l[7+f.ax])<0.005) return false;
    return true;
  });
}
const valOf = (i,f)=> f && f.ax!=null ? L[i][7+f.ax] : L[i][6];
const sumOf = (ix,f)=> Math.round(ix.reduce((s,i)=>s+valOf(i,f),0)*100)/100;

/* ---------- rendu d'un chiffre cliquable ---------- */
let FS = [], TS = [];
function num(v,f,o){
  o = o||{};
  const c = o.plain ? '' : ' '+cls(v);
  if(!f) return `<span class="mono${c}">${fmt(v,o.blank)}</span>`;
  FS.push(f); TS.push(o.title||'');
  return `<button class="f${o.calc?' calc':''}${c}" data-f="${FS.length-1}" data-v="${v}">${fmt(v,o.blank)}</button>`;
}
const cell = (v,f,o)=>`<td class="n">${num(v,f,o)}</td>`;

/* ---------- tiroir ---------- */
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function closeD(){drawer.classList.remove('on');scrim.classList.remove('on');drawer.setAttribute('aria-hidden','true');}
document.getElementById('dclose').onclick=closeD; scrim.onclick=closeD;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();});

function openD(f,title,expected){
  const ix = select(f), tot = sumOf(ix,f), ok = Math.abs(tot-expected)<0.02;
  document.getElementById('dtitle').textContent = title||'Détail';
  const why = [];
  if(f.cfa) why.push(`compte CFA <strong>${E(f.cfa)}</strong> — ${E(D.plan[f.cfa]||'')}`);
  if(f.cls) why.push(`comptes de classe <strong>${f.cls}</strong>`);
  if(f.src) why.push(`compte SECOGEST <strong>${E(f.src)}</strong>`);
  if(f.piece) why.push(`écriture de clôture <strong>${E(f.piece)}</strong>`);
  if(f.cle) why.push(`clé <strong>${E(f.cle)}</strong>`);
  if(f.ax!=null) why.push(`part de l'axe <strong>${AXN[f.ax]}</strong>`);
  if(f.note) why.push(f.note);
  if(f.mod) why.push(f.mod);
  document.getElementById('dwhy').innerHTML = why.length? why.join(' · ') :
    'Toutes les lignes de charges et de produits du grand livre.';
  document.getElementById('dcheck').innerHTML = f.mod ?
    `<div><span class="lab">Chiffre affiché — votre modèle</span><span class="val">${fmt(expected)}</span></div>
     <div><span class="lab">Ce que porte le grand livre</span><span class="val">${fmt(tot)}</span></div>
     <div><span class="lab">Écart modèle − grand livre</span><span class="val ${Math.abs(tot-expected)<0.02?'ok':''}">${Math.abs(tot-expected)<0.02?'✓ 0,00':fmt(R2b(expected-tot))}</span></div>
     <div><span class="lab">Lignes de grand livre</span><span class="val">${ix.length}</span></div>` :
    f.calc ?
    `<div><span class="lab">Chiffre affiché</span><span class="val">${fmt(expected)}</span></div>
     <div><span class="lab">Mode d'obtention</span><span class="val" style="font-size:12.5px;font-weight:500">${E(f.calc)}</span></div>
     <div><span class="lab">Base répartie</span><span class="val">${fmt(tot)}</span></div>
     <div><span class="lab">Lignes de la base</span><span class="val">${ix.length}</span></div>` :
    `<div><span class="lab">Chiffre affiché</span><span class="val">${fmt(expected)}</span></div>
     <div><span class="lab">Somme des lignes</span><span class="val ${ok?'ok':'ko'}">${fmt(tot)}</span></div>
     <div><span class="lab">Contrôle</span><span class="val ${ok?'ok':'ko'}">${ok?'✓ concordant':'✗ écart '+fmt(Math.round((tot-expected)*100)/100)}</span></div>
     <div><span class="lab">Lignes de grand livre</span><span class="val">${ix.length}</span></div>`;
  const body = document.getElementById('dbody');
  if(!ix.length){ body.innerHTML='<p class="empty">Aucune ligne de grand livre ne compose ce chiffre. Voir l’explication ci-dessus.</p>'; }
  else{
    const ax = f.ax!=null;
    ix.sort((a,b)=>Math.abs(valOf(b,f))-Math.abs(valOf(a,f)));
    body.innerHTML = `<table><thead><tr>
      <th>Date</th><th>Pièce</th><th>Jnl</th><th>Libellé du grand livre</th>
      <th>Cpte SECOGEST</th><th>Cpte CFA</th><th class="n">Montant</th>
      ${ax?`<th class="n">Part ${E(AXN[f.ax])}</th>`:''}<th>Clé analytique</th></tr></thead><tbody>`+
      ix.map(i=>{const l=L[i];return `<tr><td class="mono">${E(l[0])}</td><td class="mono">${E(l[1])}</td>
        <td class="c mono">${E(l[2])}</td><td class="lib">${E(l[3])}</td>
        <td class="c mono">${E(l[4])}</td><td class="c mono">${E(l[5])}</td>
        <td class="n ${cls(l[6])}">${fmt(l[6])}</td>
        ${ax?`<td class="n ${cls(l[7+f.ax])}">${fmt(l[7+f.ax])}</td>`:''}
        <td class="small">${E(l[12])}</td></tr>`;}).join('')+
      `</tbody></table>`;
  }
  body.scrollTop=0;
  drawer.classList.add('on'); scrim.classList.add('on'); drawer.setAttribute('aria-hidden','false');
  document.getElementById('dclose').focus();
}
document.addEventListener('click',e=>{
  const b = e.target.closest('button.f'); if(!b) return;
  openD(FS[+b.dataset.f], TS[+b.dataset.f], +b.dataset.v);
});


/* ================= agrégats ================= */
const byCfa = {};
L.forEach((l,i)=>{ const c=l[5]; (byCfa[c]=byCfa[c]||{m:0,ax:[0,0,0,0,0],n:0});
  byCfa[c].m+=l[6]; byCfa[c].n++; for(let k=0;k<5;k++) byCfa[c].ax[k]+=l[7+k]; });
const R2 = v=>Math.round(v*100)/100;
const ORD = D.ordre.filter(c=>byCfa[c]);
const AX = D.axes, CAS = D.cascade, RES = D.resultat;
const axCls = (c,k)=>R2(L.reduce((s,l)=>s+(l[5][0]===c?l[7+k]:0),0));
const clsTot = c=>R2(L.reduce((s,l)=>s+(l[5][0]===c?l[6]:0),0));

/* ================= sections ================= */
const SEC = [];
const add=(k,t,f)=>SEC.push({k,t,f});

/* ---- 1. analytique comptable ---- */
add('1','Analytique comptable',()=>{
  let h = head('Analytique comptable — par compte CFA',
    "Le compte de résultat en plan comptable CFA, ventilé sur les cinq axes. Chaque chiffre ouvre les lignes de grand livre qui le composent.");
  h += `<div class="tw"><table><thead><tr><th>Compte</th><th>Intitulé</th><th class="n">Montant</th>`+
       AXN.map(a=>`<th class="n">${a}</th>`).join('')+`<th class="n">Lignes</th></tr></thead><tbody>`;
  [['7','Produits'],['6','Charges']].forEach(([c,lab])=>{
    h += `<tr class="sub"><td colspan="9">${lab}</td></tr>`;
    ORD.filter(x=>x[0]===c).forEach(code=>{
      const g=byCfa[code];
      h += `<tr><td class="mono">${E(code)}</td><td>${E(D.plan[code]||'')}</td>`+
        cell(R2(g.m),{cfa:code},{title:`${code} — ${D.plan[code]||''}`})+
        g.ax.map((v,k)=>cell(R2(v),{cfa:code,ax:k},{blank:1,title:`${code} · axe ${AXN[k]}`})).join('')+
        `<td class="n z">${g.n}</td></tr>`;
    });
    h += `<tr class="sum"><td colspan="2">Total ${lab.toLowerCase()}</td>`+
      cell(clsTot(c),{cls:c},{title:`Total ${lab.toLowerCase()}`})+
      [0,1,2,3,4].map(k=>cell(axCls(c,k),{cls:c,ax:k},{blank:1,title:`${lab} · axe ${AXN[k]}`})).join('')+
      `<td></td></tr>`;
  });
  h += `<tr class="sum"><td colspan="2">Résultat de l'exercice</td>`+
    cell(RES,{},{title:"Résultat de l'exercice"})+
    AX.map((v,k)=>cell(R2(v),{ax:k},{title:`Résultat · axe ${AXN[k]}`})).join('')+
    `<td class="n">${L.length}</td></tr></tbody></table></div>`;
  h += note("La somme des cinq axes redonne la colonne « Montant », ligne à ligne comme au total. "+
    "Un chiffre en pointillé s'ouvre : le tiroir recalcule la somme des lignes et affiche le contrôle de concordance.");
  return h;
});

/* ---- 2. résultat par axe ---- */
add('2','Résultat par axe',()=>{
  const prod=[0,1,2,3,4].map(k=>axCls('7',k)), chg=[0,1,2,3,4].map(k=>axCls('6',k));
  const recu={0:CAS.vers_app,1:R2(CAS.vers_fpc+D.qpaura),2:R2(CAS.vers_aura-D.qpaura),4:0};
  const apres={0:CAS.app,1:CAS.fpc,2:CAS.aura,4:CAS.hp};
  let h = head('Le résultat de chaque activité',
    "Avant cascade : ce que chaque axe porte en propre. Après cascade : le commun réparti par les clés n° 1 et n° 2.");
  h += `<div class="tw"><table><thead><tr><th>Axe</th><th class="n">Produits</th><th class="n">Charges</th>
    <th class="n">Résultat avant cascade</th><th class="n">Reçu du commun</th><th class="n">Résultat après cascade</th></tr></thead><tbody>`;
  AXN.forEach((a,k)=>{
    const av=R2(prod[k]+chg[k]);
    if(k===3){
      h+=`<tr><td>${a}</td>`+cell(prod[k],{cls:'7',ax:k},{blank:1,title:`Produits · ${a}`})+
        cell(chg[k],{cls:'6',ax:k},{title:`Charges · ${a}`})+cell(av,{ax:k},{title:`Résultat avant cascade · ${a}`})+
        cell(R2(-CAS.commun),{ax:3,calc:'réparti par les clés n° 1 et n° 2',note:'le commun est intégralement reversé'},{title:'Commun reversé'})+
        `<td class="n z">·</td></tr>`;
    } else {
      h+=`<tr><td>${a}</td>`+cell(prod[k],{cls:'7',ax:k},{blank:1,title:`Produits · ${a}`})+
        cell(chg[k],{cls:'6',ax:k},{title:`Charges · ${a}`})+cell(av,{ax:k},{title:`Résultat avant cascade · ${a}`})+
        cell(recu[k],recu[k]?{ax:3,calc:cascadeTxt(k),note:'part du commun revenant à cet axe'}:null,{title:`Part du commun · ${a}`,blank:1})+
        cell(apres[k],{ax:k,calc:'résultat propre + part du commun',note:`${a} après cascade`},{title:`Résultat après cascade · ${a}`})+`</tr>`;
    }
  });
  h += `<tr class="sum"><td>Total</td>`+cell(clsTot('7'),{cls:'7'},{title:'Produits'})+
    cell(clsTot('6'),{cls:'6'},{title:'Charges'})+cell(RES,{},{title:'Résultat'})+
    `<td class="n z">·</td>`+cell(RES,{},{title:'Résultat'})+`</tr></tbody></table></div>`;
  h += `<h3 class="sec">La cascade, pas à pas</h3><div class="tw"><table><tbody>`+
    [["Commun à répartir",CAS.commun,{ax:3}],
     [`Clé n° 1 — ${D.cle1.toFixed(2).replace('.',',')} % vers la Ligue AURA (32 jours de Xavier sur 600)`,CAS.vers_aura,{ax:3,calc:D.cle1+' % du commun'}],
     ["Reste après la Ligue AURA",R2(CAS.commun-CAS.vers_aura),{ax:3,calc:'commun moins la part AURA'}],
     [`Clé n° 2 — ${D.cle2.toFixed(2).replace('.',',')} % vers la formation continue (part de ses produits)`,CAS.vers_fpc,{ax:3,calc:D.cle2+' % du reste'}],
     ["Solde vers l'apprentissage",CAS.vers_app,{ax:3,calc:'le reste après les clés n° 1 et n° 2'}],
     ["Quote-part des moyens de la formation continue reprise par la Ligue AURA",-D.qpaura,{ax:1,calc:'7,69 % des moyens FPC — 1 action sur 13'}]]
    .map(([lab,v,f])=>`<tr><td>${lab}</td>${cell(v,f,{title:lab})}</tr>`).join('')+
    `</tbody></table></div>`;

function dimTable(lab,items,withAx){
  const rows=items.filter(([n,ix])=>ix.length);
  const tot=R2(rows.reduce((s,[n,ix])=>s+sumOf(ix),0));
  let h=`<div class="tw"><table><thead><tr><th>${lab}</th><th class="n">Montant</th><th class="n">Lignes</th>`+
    (withAx?AXN.map(a=>`<th class="n">${a}</th>`).join(''):'<th>Comptes CFA</th>')+`</tr></thead><tbody>`;
  rows.slice().sort((a,b)=>sumOf(a[1])-sumOf(b[1])).forEach(([n,ix])=>{
    h+=`<tr><td>${E(n)}</td>`+cell(sumOf(ix),{idx:ix,note:E(n)},{title:E(n)})+`<td class="n z">${ix.length}</td>`+
      (withAx?[0,1,2,3,4].map(k=>cell(sumOf(ix,{ax:k}),{idx:ix,ax:k,note:E(n)},{blank:1,title:`${E(n)} · ${AXN[k]}`})).join('')
             :`<td class="c mono small">${[...new Set(ix.map(i=>L[i][5]))].sort().join(' ')}</td>`)+`</tr>`;
  });
  const allIx=[].concat(...rows.map(r=>r[1]));
  h+=`<tr class="sum"><td>Total</td>`+cell(tot,{idx:allIx},{title:'Total'})+`<td class="n">${allIx.length}</td>`+
    (withAx?[0,1,2,3,4].map(k=>cell(sumOf(allIx,{ax:k}),{idx:allIx,ax:k},{blank:1,title:`Total · ${AXN[k]}`})).join(''):'<td></td>')+
    `</tr></tbody></table></div>`;
  return h;
}

/* ---- 18. direct et indirect ---- */
add('18','Charges directes et indirectes',()=>{
  const DI=D.dirind, N=DI.natures;
  const CH=R2(DI.synthese.filter(x=>x[0]!=='Produit').reduce((a,x)=>a+x[2],0));
  let h=head('Charges directes et charges indirectes',
    "Une charge est directe quand la pièce désigne l'activité — apprentissage, formation continue, Ligue AURA. Elle est indirecte quand il faut une clé pour la répartir.");
  h+=`<div class="tw"><table><thead><tr><th>Nature</th><th class="n">Lignes</th><th class="n">Montant</th>
    <th class="n">Part des charges</th><th></th></tr></thead><tbody>`;
  const mxs=Math.max(...DI.synthese.filter(x=>x[0]!=='Produit').map(x=>Math.abs(x[2])));
  DI.synthese.forEach(x=>{
    h+=`<tr><td>${E(x[0])}</td><td class="n z">${x[1]}</td>`+
      cell(x[2],{idx:x[3],note:`toutes les lignes de nature « ${E(x[0])} »`},{title:E(x[0])})+
      `<td class="n mono ${x[0]==='Produit'?'z':''}">${x[0]==='Produit'?'·':(100*x[2]/CH).toFixed(2).replace('.',',')+' %'}</td>
       <td style="width:180px">${x[0]==='Produit'?'':`<span class="bar wide" style="--w:${(100*Math.abs(x[2])/mxs).toFixed(1)}%"></span>`}</td></tr>`;
  });
  h+=`<tr class="sum"><td>Total</td><td class="n">${DI.synthese.reduce((a,x)=>a+x[1],0)}</td>
    <td class="n mono">${fmt(RES)}</td><td></td><td></td></tr></tbody></table></div>`;
  h+=`<h3 class="sec">Compte par compte</h3><div class="tw"><table><thead><tr><th>Compte</th><th>Intitulé</th>`+
    N.map(n=>`<th class="n">${E(n)}</th>`).join('')+`<th class="n">Total</th><th class="n">Taux indirect</th></tr></thead><tbody>`;
  DI.comptes.forEach(c=>{
    const vals=c.slice(2), tot=R2(vals.reduce((a,v)=>a+v[0],0)), ind=R2(vals[1][0]+vals[2][0]);
    h+=`<tr><td class="mono">${E(c[0])}</td><td class="small">${E(c[1])}</td>`+
      vals.map((v,k)=>cell(v[0],v[1].length?{idx:v[1],note:`${E(c[0])} · ${E(N[k])}`}:null,{blank:1,title:`${E(c[0])} — ${E(N[k])}`})).join('')+
      `<td class="n mono"><strong>${fmt(tot)}</strong></td>
       <td class="n mono ${c[0][0]==='6'?'':'z'}">${c[0][0]==='6'&&tot?(100*ind/tot).toFixed(2).replace('.',',')+' %':'·'}</td></tr>`;
  });
  h+=`<tr class="sum"><td colspan="2">Total</td>`+
    N.map((n,k)=>cell(R2(DI.comptes.reduce((a,c)=>a+c[2+k][0],0)),null)).join('')+
    `<td class="n mono">${fmt(RES)}</td><td></td></tr></tbody></table></div>`;
  h+=note("Une charge « directe » porte 100 % sur une seule activité parce que sa pièce la désigne : le nom d'un "+
    "apprenti, l'intitulé d'une action, le nom de la Ligue. Une charge « indirecte » passe en tout ou partie par "+
    "le commun, et c'est la cascade des clés n° 1 et n° 2 qui la répartit ensuite. La distinction se lit compte "+
    "par compte dans la dernière colonne : un taux de 0 % désigne un compte entièrement traçable, un taux de "+
    "100 % un compte de structure.");
  return h;
});

/* ================= routeur ================= */
function head(t,p){return `<div class="head"><p class="eyebrow">WE-FORM · exercice 1 · plan comptable CFA</p><h2>${E(t)}</h2><p>${E(p)}</p></div>`;}
function note(html,warn){return `<p class="note${warn?' warn':''}">${html}</p>`;}
function bind(){}
let cur=0;
function show(i){
  cur=i; FS=[]; TS=[];
  document.getElementById('main').innerHTML=SEC[i].f();
  document.querySelectorAll('#nav button').forEach((b,j)=>b.setAttribute('aria-current',j===i?'true':'false'));
  if(SEC[i].k==='3'){['q','fc','fa'].forEach(id=>{const el=document.getElementById(id);
    if(el) el.oninput=el.onchange=()=>{renderDet();}}); renderDet();}
  if(SEC[i].k==='5'){['qs','fs'].forEach(id=>{const el=document.getElementById(id); if(el) el.oninput=el.onchange=renderStag;}); renderStag();}
  if(SEC[i].k==='12'){const el=document.getElementById('qm'); if(el) el.oninput=renderMap; renderMap();}
  window.scrollTo(0,0);
}
document.getElementById('nav').innerHTML=SEC.map((s,i)=>
  `<button type="button" data-i="${i}"><span class="k">${s.k}</span><span>${E(s.t)}</span></button>`).join('');
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-i]'); if(b) show(+b.dataset.i);});
show(0);

</script>
